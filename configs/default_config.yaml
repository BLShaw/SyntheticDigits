# Default Configuration for GAN Training

# Model parameters
model:
  noise_dim: 100
  img_channels: 1
  img_size: 28

# Training parameters
training:
  batch_size: 128
  epochs: 25
  lr: 0.0002
  beta1: 0.5

# Data parameters
data:
  data_dir: "./data"
  download: true

# Output parameters
output:
  output_dir: "results"

# Visualization parameters
visualization:
  save_images_epochs: [1, 5, 10, 25, 50, 100]
  sample_noise_size: 64