[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syntheticdigits"
version = "0.1.0"
description = "A PyTorch implementation of a Generative Adversarial Network for generating synthetic MNIST digit images"
readme = "README.md"
authors = [{name = "BLShaw"}]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
]
keywords = ["pytorch", "gan", "mnist", "deep-learning", "generative-models"]
dependencies = [
    "torch>=1.9.0",
    "torchvision>=0.10.0",
    "numpy>=1.21.0",
    "matplotlib>=3.4.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/BLShaw/SyntheticDigits"
Repository = "https://github.com/BLShaw/SyntheticDigits"
"Bug Tracker" = "https://github.com/BLShaw/SyntheticDigits/issues"

[project.scripts]
syntheticdigits-train = "train:main"